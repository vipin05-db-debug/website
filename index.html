<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOURCE VAULT | GRID STACKS</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CORE AESTHETICS --- */
        :root {
            --bg: #050505;
            --card-front: #181818;
            --card-border: #333;
            --accent: #b4f705;
            --text: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* --- 2. NAVIGATION --- */
        nav {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(5,5,5,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; }
        .hamburger { width: 30px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
        .line { width: 100%; height: 2px; background: white; }

        /* --- 3. NEW TOP ELEMENT (Profile Header) --- */
        .profile-header {
            padding: 30px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px dashed #222;
        }
        .avatar {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #222, #000);
            border: 2px solid var(--accent);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: bold;
            color: var(--accent);
        }
        .stats { flex: 1; }
        .stats h2 { font-size: 1.2rem; margin-bottom: 5px; }
        .stats p { font-size: 0.8rem; color: #666; }
        .tag-row { display: flex; gap: 10px; margin-top: 5px; }
        .tag { font-size: 0.7rem; padding: 2px 8px; border: 1px solid #333; border-radius: 4px; color: #888; }

        /* --- 4. THE GRID OF STACKS --- */
        .library-container {
            padding: 30px 20px;
        }
        
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 Columns */
            grid-template-rows: repeat(3, auto); /* 3 Rows */
            gap: 20px 15px; /* Row Gap, Col Gap */
        }

        /* The Wrapper for each Grid Item */
        .stack-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4; /* Shape of each grid item */
            perspective: 1000px;
            z-index: 1; /* Default */
        }

        /* The Individual Cards inside the Stack */
        .mini-card {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--card-front);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transform-origin: center bottom;
            cursor: grab;
            /* Important: Allow card to fly out of its grid cell */
            will-change: transform;
        }

        .card-content { flex: 1; pointer-events: none; }
        .card-icon { 
            width: 30px; height: 30px; background: #222; 
            border-radius: 8px; margin-bottom: 10px; 
        }
        .card-title { font-size: 0.9rem; font-weight: bold; line-height: 1.2; }
        .card-sub { font-size: 0.7rem; color: #666; margin-top: 5px; }
        
        .card-number {
            position: absolute; top: 10px; right: 10px;
            font-size: 0.7rem; color: var(--accent); opacity: 0.5;
        }

        /* --- 5. SURPRISE FOOTER --- */
        .surprise-wrapper {
            padding: 40px 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .surprise-btn {
            border: 1px solid #333; padding: 15px 30px;
            border-radius: 30px; color: #666; cursor: pointer;
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;
        }
        .hidden-footer { display: none; margin-top: 20px; text-align: center; }
        .hidden-footer h2 { font-size: 2rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <nav>
        <div class="logo">VAULT.</div>
        <div class="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </nav>

    <header class="profile-header">
        <div class="avatar">DV</div>
        <div class="stats">
            <h2>Dev_Vault</h2>
            <p>Full Stack Library</p>
            <div class="tag-row">
                <span class="tag">GSAP</span>
                <span class="tag">React</span>
                <span class="tag">3D</span>
            </div>
        </div>
    </header>

    <section class="library-container">
        <div class="grid-layout" id="gridContainer">
            </div>
    </section>

    <div class="surprise-wrapper">
        <div class="surprise-btn">Open Surprise</div>
        <footer class="hidden-footer">
            <h2>ASHES</h2>
            <p>System Offline.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // --- 1. DATA CONFIG (6 Projects, 6 Variations each) ---
        const projectCategories = [
            { title: "UI Components", color: "#b4f705" },
            { title: "Animation Lib", color: "#05f7ea" },
            { title: "Backend API", color: "#f7055e" },
            { title: "3D Models", color: "#f79605" },
            { title: "Dashboards", color: "#a105f7" },
            { title: "Auth Systems", color: "#f7f7f7" }
        ];

        const gridContainer = document.getElementById('gridContainer');

        // --- 2. GENERATE THE GRID OF STACKS ---
        projectCategories.forEach((cat, gridIndex) => {
            
            // Create the Wrapper (One Grid Cell)
            const wrapper = document.createElement('div');
            wrapper.className = 'stack-wrapper';
            wrapper.style.zIndex = 6 - gridIndex; // Layering fix

            // Create 6 Cards INSIDE this wrapper
            for (let i = 0; i < 6; i++) {
                const card = document.createElement('div');
                card.className = 'mini-card';
                card.style.zIndex = 6 - i; // Stack order (Top is 6)
                
                // Visual Styling for depth
                // Lower cards are smaller and darker initially
                if(i > 0) {
                    card.style.transform = `scale(${1 - (i * 0.05)}) translateY(${i * 8}px)`;
                    card.style.filter = `brightness(${1 - (i * 0.15)})`;
                }

                card.innerHTML = `
                    <div class="card-number">#${gridIndex+1}.${i+1}</div>
                    <div class="card-content">
                        <div class="card-icon" style="background:${i === 0 ? cat.color : '#222'}"></div>
                        <div class="card-title">${cat.title}</div>
                        <div class="card-sub">Variant 0${i+1}</div>
                    </div>
                `;
                
                wrapper.appendChild(card);
            }
            
            gridContainer.appendChild(wrapper);
        });

        // --- 3. SWIPE LOGIC FOR *EVERY* STACK ---
        const allWrappers = document.querySelectorAll('.stack-wrapper');

        allWrappers.forEach(wrapper => {
            const cards = Array.from(wrapper.querySelectorAll('.mini-card'));
            
            cards.forEach((card, index) => {
                // We only attach physics to cards. 
                // But conceptually, you can only drag the TOP visible card.
                
                let startX = 0;
                let isDragging = false;

                card.addEventListener('touchstart', (e) => {
                    // Check if this card is currently the top one visually
                    // We can check this by seeing if its scale is 1 (simplest way based on our layout logic)
                    // Or check if previous siblings are gone.
                    // For simplicity: We allow dragging any card, but visual z-index hides lower ones.
                    
                    startX = e.touches[0].clientX;
                    isDragging = true;
                    card.style.transition = 'none';
                    // Bring wrapper to front so card doesn't clip behind neighbor grid items
                    wrapper.style.zIndex = 100; 
                });

                card.addEventListener('touchmove', (e) => {
                    if(!isDragging) return;
                    const currentX = e.touches[0].clientX;
                    const diff = currentX - startX;
                    
                    gsap.set(card, {
                        x: diff,
                        rotation: diff * 0.1
                    });
                });

                card.addEventListener('touchend', (e) => {
                    if(!isDragging) return;
                    isDragging = false;
                    wrapper.style.zIndex = ""; // Reset wrapper z-index
                    
                    const currentX = e.changedTouches[0].clientX;
                    const diff = currentX - startX;
                    const threshold = 60; // Less distance needed for small cards

                    if (Math.abs(diff) > threshold) {
                        // SWIPE SUCCESS -> Fly Away
                        const dir = diff > 0 ? 1 : -1;
                        
                        gsap.to(card, {
                            x: dir * 300,
                            y: 50,
                            rotation: dir * 45,
                            opacity: 0,
                            duration: 0.4,
                            ease: "power2.out",
                            onComplete: () => {
                                // Move to back of stack (Infinite Loop)
                                wrapper.prepend(card); // Moves DOM node to bottom of stack (visually back)
                                
                                // Reset position
                                gsap.set(card, { x: 0, y: 0, rotation: 0, opacity: 1, scale: 0.75, filter: "brightness(0.4)" });
                                
                                // Re-organize the stack visuals
                                updateStackVisuals(wrapper);
                            }
                        });
                    } else {
                        // SWIPE CANCEL -> Snap Back
                        gsap.to(card, {
                            x: 0, rotation: 0, duration: 0.3, ease: "back.out(2)"
                        });
                    }
                });
            });
        });

        // Helper to reset the depth look after a swipe
        function updateStackVisuals(wrapper) {
            const cards = Array.from(wrapper.children); // Get all cards in new order
            // Last child in DOM = Top of visual stack in CSS absolute positioning usually,
            // BUT our z-index logic was `6 - i`.
            // Let's re-assign z-indices and transforms based on DOM order.
            // In our loop, we appended. So last appended is on top? No, `position:absolute` stacks by DOM order (last is top).
            // Wait, we set explicit Z-Index `6-i` in generation loop (0 is top). 
            
            // To make infinite cycle work easiest:
            // We want the LAST element in DOM to be the TOP card.
            // When we generate, we did loop 0..6. 0 was Top.
            // If we move 0 to `prepend` (start of DOM), it becomes "bottom" card.
            
            // Let's re-loop all cards in the wrapper and set styles based on reverse index
            // The cards at the END of the list are the TOP cards.
            
            const reversedCards = cards.slice().reverse(); // Now index 0 is the Top Card (Last in DOM)
            
            reversedCards.forEach((c, i) => {
                gsap.to(c, {
                    zIndex: 6 - i,
                    scale: 1 - (i * 0.05),
                    y: i * 8,
                    filter: `brightness(${1 - (i * 0.15)})`,
                    duration: 0.3
                });
            });
        }

        // --- 4. SURPRISE FOOTER LOGIC ---
        const sBtn = document.querySelector('.surprise-btn');
        sBtn.addEventListener('click', () => {
            gsap.to(sBtn, { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 });
            gsap.to(sBtn, { y: -20, opacity: 0, duration: 0.5, delay: 0.2, display: 'none' });
            gsap.fromTo('.hidden-footer', 
                { display: 'block', opacity: 0, y: 20 }, 
                { opacity: 1, y: 0, duration: 1, delay: 0.6 }
            );
        });

    </script>
</body>
</html>
